name: Build ISO

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "iso-profiles/**"
      - "tools/**"
      - "build.sh"
      - ".github/workflows/build-iso.yml"
  push:
    branches: [main]
    paths:
      - "iso-profiles/**"
      - "build.sh"

jobs:
  packages:
    name: Check package names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check every package is in a current Artix repo
        run: tools/check-packages.sh artixy

  iso:
    name: Build artixy (runit)
    needs: packages
    runs-on: ubuntu-latest
    container:
      image: artixlinux/artixlinux:latest
      # buildiso mounts overlayfs and runs chroots. The chroots must live on
      # the runner's ext4 disk: the container's own overlay root cannot be an
      # overlayfs upperdir.
      options: --privileged -v /mnt/artools:/var/lib/artools
    steps:
      - name: Install artools
        run: |
          pacman-key --init
          pacman-key --populate artix
          pacman -Syu --noconfirm --needed artools-iso git
      - uses: actions/checkout@v4
      - name: Build ISO
        # container jobs get HOME=/github/home, so pin the workspace
        env:
          WORKSPACE_DIR: /root/artools-workspace
        run: ./build.sh
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: artixy-iso
          path: /root/artools-workspace/iso/artixy/*.iso
          retention-days: 7
          compression-level: 0

  boot:
    name: Boot test (${{ matrix.firmware }})
    needs: iso
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi, serial]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU and OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf socat tesseract-ocr tesseract-ocr-eng netpbm libarchive-tools
      - uses: actions/download-artifact@v4
        with:
          name: artixy-iso
          path: iso
      - name: Boot, log in, check installer and services
        run: tools/qemu-test.sh iso/*.iso ${{ matrix.firmware }} qemu-out
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-screenshots-${{ matrix.firmware }}
          path: qemu-out/*.png
          retention-days: 7

  install:
    name: Install test (${{ matrix.desktop }}, ${{ matrix.firmware }}${{ matrix.encrypt == 'yes' && ', LUKS' || '' }})
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { desktop: i3, firmware: bios, encrypt: "no" }
          - { desktop: hyprland, firmware: uefi, encrypt: "yes" }
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU and OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf socat tesseract-ocr tesseract-ocr-eng netpbm
      - uses: actions/download-artifact@v4
        with:
          name: artixy-iso
          path: iso
      - name: Install with artixy-install --auto, boot the disk, check it
        run: tools/qemu-install-test.sh iso/*.iso ${{ matrix.firmware }} ${{ matrix.desktop }} ${{ matrix.encrypt }} qemu-out
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-screenshots-${{ matrix.desktop }}-${{ matrix.firmware }}
          path: |
            qemu-out/*.png
            qemu-out/*.log
          retention-days: 7
